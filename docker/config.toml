# fling server access rules for the docker smoke test.
#
# Policy is default-deny: a command must be listed here AND its arguments must
# match one of the `allow` glob patterns. Patterns are matched against the
# space-joined arguments; `*` matches any run of characters, `?` a single one.

# `foo list ...` and `foo status` are permitted; `foo create ...` is not.
[commands.foo]
executable = "/bin/echo"
allow = ["list*", "status"]

# `relaycat` forwards stdin to cat, with any arguments allowed.
[commands.relaycat]
executable = "/bin/cat"
allow = ["*"]

# Note: `bar` is intentionally NOT configured, so relaying it is denied.
