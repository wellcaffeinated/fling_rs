name: Release

# Never triggered by pushing a tag. Release-plz owns releases and calls this
# workflow with the tag it created, since a tag pushed with GITHUB_TOKEN can't
# trigger a workflow itself. Dispatch it by hand to rebuild an existing tag:
#
#   gh workflow run release.yml -f tag=v1.2.3
on:
  workflow_call:
    inputs:
      tag:
        description: Tag to build from and attach binaries to.
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build from and attach binaries to, e.g. v1.2.3
        type: string
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static Linux binaries — ideal for containers
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          # macOS — native runners for each arch
          - target: x86_64-apple-darwin
            os: macos-15-intel    # Intel
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest      # Apple Silicon (macos-14+)
            cross: false

    steps:
      - uses: actions/checkout@v6
        with:
          # The caller's ref is main, so the tag has to be checked out
          # explicitly to build the code that was actually released.
          ref: ${{ inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@cross

      - name: Build
        run: |
          ${{ matrix.cross && 'cross' || 'cargo' }} build \
            --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          target=${{ matrix.target }}
          asset=fling-${TAG}-${target}.tar.gz
          tar -czf "${asset}" \
            -C target/${target}/release fling
          sha256sum "${asset}" > "${asset}.sha256"
          echo "ASSET=${asset}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Combined checksums
        run: cat artifacts/*.sha256 | sort > checksums.sha256

      - name: Attach binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          # Release-plz has usually created the release already, with the
          # changelog as its body — upload into it rather than replacing it.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* checksums.sha256 --clobber
          else
            gh release create "$TAG" --generate-notes \
              artifacts/* checksums.sha256
          fi
