[package]
name = "fling"
version = "0.2.0"
edition = "2024"
publish = false

[dependencies]
tokio      = { version = "1", features = ["full"] }
clap       = { version = "4", features = ["derive", "env"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"
anyhow     = "1"
globset    = "0.4"
