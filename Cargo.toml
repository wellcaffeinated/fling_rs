[package]
name = "fling"
version = "0.2.1"
edition = "2024"
# `publish` is deliberately left at its default. Setting `publish = false` here
# makes release-plz skip the package entirely — no git tag, no release. Cargo
# publishing is disabled in release-plz.toml instead.

[dependencies]
tokio      = { version = "1", features = ["full"] }
clap       = { version = "4", features = ["derive", "env"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"
anyhow     = "1"
globset    = "0.4"
